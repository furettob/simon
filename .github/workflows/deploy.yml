name: Deploy Vite React App to GitHub Pages

on:
  push:
    branches: [public]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout source branch
      - uses: actions/checkout@v4

      # Step 2: Set up Node
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Step 3: Install dependencies
      - run: npm ci

      # Step 4: Build the app
      - run: npm run build

      # Step 5: Deploy to gh-pages
      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git config --global user.name "github-actions" && git config --global user.email "github-actions@github.com" && npx gh-pages -d dist --no-history
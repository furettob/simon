name: Deploy to GitHub Pages - v2

on:
  push:
    branches: [public]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build

      - run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          npx gh-pages -d dist
